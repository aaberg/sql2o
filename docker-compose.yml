services:
    postgres-db:
        image: 'postgres:latest'
        ports:
            - 15432:5432
        environment:
            - POSTGRES_USER=testuser
            - POSTGRES_PASSWORD=testpassword
        networks:
            sql2o-network:

    oracle-xe-21c:
        image: 'container-registry.oracle.com/database/express:latest'
        volumes:
            - oracle-xe-21c-volume:/opt/oracle/oradata
        ports:
            - "1521:1521"
            - "5500:5500"
        environment:
            - ORACLE_PWD=testpassword
            - ORACLE_CHARACTERSET=AL32UTF8
        networks:
            sql2o-network:

    db2-ce:
            image: 'ibmcom/db2:11.5.8.0'
            privileged: true
            shm_size: '4gb'
            ports:
                - "50000:50000"
            environment:
                - LICENSE=accept
                - DB2INSTANCE=db2inst1
                - DB2INST1_PASSWORD=testpassword
                - DBNAME=testdb
                - BLU=false
                - ENABLE_ORACLE_COMPATIBILITY=false
                - UPDATEAVAIL=NO
                - TO_CREATE_SAMPLEDB=false
                - REPODB=false
                - IS_OSXFS=false
                # The database is meant to live in a volume rather than in the home directory of the instance, which is
                # what the image would otherwise persist on the docker for windows filesystem.
                - PERSISTENT_HOME=false
                - HADR_ENABLED=false
            volumes:
                - db2-ce-volume:/database
            healthcheck:
                test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to testdb' | grep -q Connected"]
                interval: 30s
                timeout: 30s
                retries: 40
                # The instance takes several minutes to come up the first time, and a failure during that window is
                # expected rather than a real problem.
                start_period: 300s
            networks:
                sql2o-network:
    
volumes:
    oracle-xe-21c-volume:
    db2-ce-volume:

networks:
    sql2o-network:
        name: sql2o-network
        driver: bridge
