# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  release:
    types: [ "created" ]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Docker Compose Action
        uses: isbang/compose-action@v1.5.1
      - name: Wait for Db2 to accept connections
        # Db2 Community Edition initialises for several minutes on a fresh volume, and nothing else waits for it:
        # without this the db2 module tests outrun the server and fail on the socket. The check is the same one as
        # the healthcheck of the db2-ce service, which compose itself does not wait on.
        run: |
          for i in $(seq 1 40); do
            if docker compose exec -T db2-ce su - db2inst1 -c 'db2 connect to testdb' 2>/dev/null | grep -q 'Local database alias'; then
              echo "db2 is ready"
              exit 0
            fi
            sleep 15
          done
          echo "db2 did not become ready in time"
          docker compose logs db2-ce | tail -30
          exit 1
      - name: Set up JDK 21 for building and testing
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Print java version
        run: java -version
      - name: Build and test with Maven java 21
        run: mvn -B package --file pom.xml
      - name: Set up JDK 17 for testing
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Print java version
        run: java -version
      - name: Test with Maven java 17
        run: mvn test

  deploy-maven-central:
    name: Deploy to Maven Central
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release'}}
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 and Set up Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Set version
        run: mvn versions:set -DnewVersion=${{ github.event.release.tag_name }}
      - name: publish to maven central
        #skipping tests, since they have already run in the previous job
        run: mvn -P release --batch-mode deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}
      - name: finish and publish deployment to Portal
        run: |
          AUTH=$(printf '%s' "$SONATYPE_AUTH" | base64)
          curl -s -X POST \
            -H "Authorization: Bearer $AUTH" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/org.sql2o?publishing_type=automatic" \
            -w "\nHTTP %{http_code}\n"
        env:
          SONATYPE_AUTH: ${{ format('{0}:{1}', secrets.MAVEN_CENTRAL_USERNAME, secrets.MAVEN_CENTRAL_TOKEN) }}
